<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Federico Cresci — Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Syne:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../Portfolio/css/main.css" />
  </head>
  <body>
    <section class="intro" aria-label="Introduzione">
      <h2 class="intro__message">
        <span class="intro__word">Inquisitive,</span>
        <!-- <span class="intro__word">Imaginative,</span>
        <span class="intro__word">Genuine.</span> -->
      </h2>
    </section>

    <main class="hero">
      <div class="hero__content">
        <nav class="hero__nav" aria-label="Navigazione Principale">
          <a href="#contatti" class="hero__button">Book a call da cambiare </a>
          <div class="hero__links">
            <a href="#progetti" class="hero__link">Progetti</a>

            <a
              href="https://www.linkedin.com/in/federico-cresci-b5853830b/"
              class="hero__link"
              target="_blank"
              >Linkedin</a
            >
          </div>
        </nav>

        <h1 class="hero__title" aria-label="Federico Cresci">
          <span>Cresci</span>
          <span>Federico</span>
        </h1>

        <figure class="hero__portrait">
          <img
            src="./assets/img/avatar.png"
            alt="Ritratto illustrto di Federico Cresci"
          />
        </figure>

        <footer class="hero__footer" id="contatti">
          <p class="hero__description">
            I currentòi work as a bho at
            <a href="" target="_blank" rel="noopener noreferrer">BHO!!</a>
            currently available for work.
          </p>

          <p
            class="hero__description hero__description hero__description--right"
          >
            Focused on interfaces and experiences, <br />
            working remotely from Italy.
          </p>
        </footer>
      </div>
    </main>

    <style>
      /*
      * Override necessari perché il layout precedente
      * centrava tutto tramite flex e padding.
      */

      .hero {
        display: block;
        padding: 0;
      }
      .hero__content {
        position: relative;
        min-height: 100svh;
      }
      .hero__nav {
        position: absolute;
        z-index: 10;
        top: clamp(24px, 3.5vw, 56px);
        left: clamp(24px, 5vw, 100px);

        display: flex;
        width: calc(100% - clamp(48px, 10vw, 200px));
        align-items: center;
        justify-content: space-between;
      }
      .hero__button,
      .hero__link {
        color: #e7e1da;
        font-size: clamp(0.85rem, 1.2vw, 1.3rem);
        font-weight: 700;
        text-decoration: none;
      }
      .hero__button {
        display: inline-flex;
        min-height: 52px;
        padding: 0 22px;
        align-items: center;
        justify-content: center;

        border: 2px solid #e7e1da;
        border-radius: 8px;

        text-transform: uppercase;
        transition:
          color 200ms ease,
          background-color 200ms ease;
      }
      .hero__button:hover,
      .hero__button:focus-visible {
        color: #0e1016;
        background-color: #e7e1da;
      }
      .hero__links {
        display: flex;
        gap: clamp(28px, 5vw, 90px);
        align-items: center;
      }
      .hero__link {
        position: relative;
      }

      .hero__link::after {
        position: absolute;
        right: 0;
        bottom: -5px;
        left: 0;

        height: 2px;
        content: "";
        background-color: currentColor;

        transform: scaleX(0);
        transform-origin: right;
        transition: transform 250ms ease;
      }
      .hero__link:hover::after,
      .hero__link:focus-visible::after {
        transform: scaleX(1);
        transform-origin: left;
      }
      /* NOME */
      .hero__title {
        position: absolute;
        z-index: 1;
        top: 17%;
        left: 50%;

        display: block;
        width: 100%;
        max-width: none;

        font-family: "Anton", Impact, sans-serif;
        font-size: clamp(6.5rem, 13vw, 15.5rem);
        font-weight: 400;
        line-height: 0.96;
        letter-spacing: -0.035em;
        text-align: center;

        transform: translateX(-50%);
      }
      .hero__title span {
        display: block;
      }
      .hero__portrait {
        position: absolute;
        z-index: 4;
        top: 49%;
        left: 40%;

        width: clamp(245px, 2.4vw, 48px);
        background-color: #898989;
        box-shadow: 0 25px 55px rgba(0, 0, 0, 0.25);

        transform: translateY(-50%, -8%);
      }
      .hero__portrait img {
        display: block;
        width: 100%;
        height: 100%;

        object-fit: cover;
        filter: grayscale(1) contrast(1.08) brightness(0.9);
        transform: scale(1.025);
      }
      /* tasti inferiori */
      .hero__footer {
        position: absolute;
        z-index: 6;
        right: clamp(24px, 5vw, 100px);
        bottom: clamp(28px, 4vw, 70px);
        left: clamp(24px, 5vw, 100px);

        display: flex;
        gap: 60px;
        align-items: flex-end;
        justify-content: space-between;
      }

      .hero__description {
        max-width: 565px;
        margin: 0;

        color: #e7e1da;
        font-size: clamp(1rem, 1.35vw, 1.5rem);
        font-weight: 600;
        line-height: 1.55;
      }
      .hero__description--right {
        text-align: right;
      }
      .hero__description a {
        text-decoration-thickness: 1px;
        text-underline-offset: 5px;
      }
      .hero__description a:hover {
        text-decoration: none;
      }

      /* adattamento layout */
      @media (max-width: 900px) {
        .hero__title {
          top: 22px;
          font-size: clamp(5rem, 18vw, 9rem);
          line-height: 0.93;
        }

        .hero__portrait {
          top: 49px;
          width: clamp(210px, 34vw, 290px);
        }
        .hero__description {
          max-width: 43%;
          font-size: 0.95rem;
        }
      }

      @media (max-width: 620px) {
        .hero,
        .hero__content {
          min-height: 900px;
        }

        .hero__nav {
          top: 22px;
          left: 20px;
          width: calc(100% - 40px);
        }

        .hero__button {
          min-height: 420px;
          padding: 0 13px;
          font-size: 0.7rem;
        }

        .hero__links {
          gap: 18px;
        }
        .hero__link {
          font-size: 0.7rem;
        }
        .hero__title {
          top: 20%;
          font-size: clamp(4.7rem, 25vw, 0.7rem);
          line-height: 0.96;
        }
        .hero__portrait {
          top: 45%;
          width: min(62vw, 255px);
          transform: translate(-50%, 0);
        }
        .hero__footer {
          right: 20px;
          bottom: 32px;
          left: 20px;

          display: grid;
          gap: 22px;
        }

        .hero__description,
        .hero__description--right {
          max-width: 100%;
          font-size: 0.9rem;
          line-height: 1.45;
          text-align: left;
        }
      }
    </style>

    <script src="./js/event.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
