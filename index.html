<!doctype html>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <section class="intro" aria-label="Introduzione">
      <h2 class="intro__message">
        <span class="intro__word"></span>
        <span class="intro__word"></span>
        <span class="intro__word"></span>
      </h2>
    </section>

    <main class="hero">
      <div class="hero__content">
        <nav class="hero__nav" aria-label="Navigazione Principale">
          <a href="#contatti" class="hero__button cursor--inglobe sticky"> </a>
          <div class="hero__links">
            <a
              href="#progetti"
              class="hero__link sticky"
              onpointerenter="tooltip('Guarda i miei progetto', event)"
              onpointermove="tooltip('Guarda i miei progetti', event)"
              onpointerleave="hide_tooltip()"
            ></a>
            <a
              href="https://www.linkedin.com/in/federico-cresci-b5853830b/"
              class="hero__link sticky"
              target="_blank"
              onpointerenter="tooltip('Guarda il mio linkedin', event)"
              onpointermove="tooltip('Guarda il mio Linkedin', event)"
              onpointerleave="hide_tooltip()"
              >Linkedin</a
            >
          </div>
        </nav>

        <h1 class="hero__title" aria-label="Federico Cresci">
          <span>Cresci</span>
          <span>Federico</span>
        </h1>

        <figure
          class="hero__portrait sticky"
          tabindex="0"
          onclick="tooltip('Federico Cresci')"
        >
          <img
            src="./assets/img/avatar_triste.png"
            alt="Ritratto illustrto di Federico Cresci"
            onpointerenter="tooltip('Federico Cresci', event)"
            onpointermove="tooltip('Federico Cresci', event)"
            onpointerleave="hide_tooltip()"
          />
        </figure>

        <footer class="hero__footer" id="contatti">
          <p class="hero__description">
            <a
              href=""
              target="_blank"
              class="sticky"
              style="color: var(--foreground); border-radius: 8px"
            ></a>
          </p>

          <p
            class="hero__description hero__description hero__description--right"
          >
            <br />
          </p>
        </footer>
      </div>
    </main>

    <section class="about" id="about">
      <div class="about__inner">
        <h2
          class="about__title"
          aria-label="I build startups, accelerate growth, create empires."
        >
          <span class="about__title-line">
            <span class="type-word" data-type="STARTUPS," data-speed="85">
              <span class="type-word__text"></span>
            </span>
          </span>

          <span class="about__title-line">
            <span class="type-word" data-type="GROWTH," data-speed="85">
              <span class="type-word__text"></span>
            </span>
          </span>

          <span class="about__title-line">
            <span class="type-word" data-type="EMPIRES." data-speed="85">
              <span class="type-word__text"></span>
            </span>
          </span>
        </h2>

        <div class="about__grid">
          <div class="about__description">
            <p></p>

            <p></p>

            <p></p>

            <p></p>
          </div>

          <aside class="about__tools">
            <div class="about__tool-group">
              <h3>
                <span
                  class="type-word"
                  data-type="Frontend Tools"
                  data-speed="55"
                >
                  <span class="type-word__text"></span>
                </span>
              </h3>

              <p></p>
            </div>

            <div class="about__tool-group">
              <h3>
                <span
                  class="type-word"
                  data-type="Backend Tools"
                  data-speed="55"
                >
                  <span class="type-word__text"></span>
                </span>
              </h3>

              <p></p>
            </div>

            <div class="about__tool-group">
              <h3>
                <span
                  class="type-word"

                  data-speed="55"
                >
                  <span class="type-word__text"></span>
                </span>
              </h3>

              <p></p>
            </div>
          </aside>
        </div>
